  <!-- Terminal Header -->
  <rect x="28" y="28" width="1124" height="62" rx="24" fill="#F1F5F9"/>
  <path d="M28 66H1152" stroke="#CBD5E1"/>

  <circle cx="60" cy="59" r="7" fill="#CBD5E1"/>
  <circle cx="84" cy="59" r="7" fill="#94A3B8"/>
